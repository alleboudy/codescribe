[project]
name = "codescribe-fleet"
version = "0.1.0"
description = "Parallel & distributed QLoRA fleet orchestrator for N Dell Precision laptops (codescribe issue #3)"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Production SSH transport. NOT needed for the test suite (which injects an
# in-memory FakeTransport) or for the local demo (which uses LocalTransport over
# a subprocess). Install only on the coordinator that drives a real fleet.
ssh = ["asyncssh>=2.14"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codescribe_fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "slow: long-running tests; run with -m slow",
]
filterwarnings = ["ignore::DeprecationWarning"]
